<!DOCTYPE html>
<html>
<head>
    <title>Math Quiz Master</title>
    <link rel="stylesheet" href="stylemath.css">
</head>
<body>

    <div class="game-container">
        <div id="start-screen" class="screen">
            <h1>Math Quiz</h1>
            <button class="main-btn" onclick="startGame()">Start Game</button>
        </div>

        <div id="game-box" class="screen hidden">
            <div class="stats">
                <span>Score: <span id="score">0</span>/10</span>
                <span>Lives: <span id="lives">❤️❤️❤️</span></span>
                <span>Time: <span id="timer">0</span>s</span>
            </div>
            <div id="question">Loading...</div>
            <input type="number" id="answer-input" placeholder="Your answer">
            <button id="submit-btn" class="main-btn">Submit</button>
        </div>

        <div id="result-screen" class="screen hidden">
            <h2 id="final-msg"></h2>
            <p>Total Time: <span id="final-time"></span> seconds</p>
            <button class="main-btn reset-btn" onclick="startGame()">Try Again</button>
        </div>
    </div>

    <script src="scriptmath.js"></script>
</body>
</html>
